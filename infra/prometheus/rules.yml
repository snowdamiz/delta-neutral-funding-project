groups:
  - name: funding-collector-safety
    rules:
      - alert: CollectorUnavailable
        expr: up{job="funding-collector"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: Funding collector is unavailable
      - alert: WriterLeaseLost
        expr: leader_lease_held == 0
        for: 10s
        labels: { severity: critical }
        annotations:
          summary: Collector writer lease is not held
      - alert: CriticalMargin
        expr: margin_ratio_ppm < 1500000
        for: 10s
        labels: { severity: critical }
        annotations:
          summary: Margin ratio is below the configured minimum
      - alert: CriticalLiquidationDistance
        expr: liquidation_distance_bps < 1000
        for: 10s
        labels: { severity: critical }
        annotations:
          summary: Liquidation distance is below the configured minimum
      - alert: AdapterStale
        expr: adapter_connected == 0
        for: 30s
        labels: { severity: high }
        annotations:
          summary: Adapter data is stale
      - alert: ReconciliationMismatch
        expr: increase(reconciliation_mismatches_total[5m]) > 0
        labels: { severity: high }
        annotations:
          summary: A reconciliation mismatch was recorded
      - alert: CriticalRiskEvent
        expr: increase(risk_events_total{severity="critical"}[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: A critical risk event was recorded
