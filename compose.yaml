name: delta-neutral-funding

x-paper-environment: &paper-environment
  EXECUTION_MODE: paper
  ADAPTER_MODE: ${ADAPTER_MODE:-synthetic}
  ADAPTER_HMAC_SECRET: ${ADAPTER_HMAC_SECRET:-local-paper-only-change-me}
  EMIT_INTERVAL_MS: ${EMIT_INTERVAL_MS:-15000}
  FUNDING_INTERVAL_EVENTS: ${FUNDING_INTERVAL_EVENTS:-12}
  FUNDING_SCAN_INTERVAL_MS: ${FUNDING_SCAN_INTERVAL_MS:-3600000}
  WALLET_SCAN_INTERVAL_MS: ${WALLET_SCAN_INTERVAL_MS:-60000}
  WALLET_FILL_LOOKBACK_MS: ${WALLET_FILL_LOOKBACK_MS:-86400000}
  SOURCE_MAX_SLOT_DRIFT: ${SOURCE_MAX_SLOT_DRIFT:-5000}
  SOURCE_MAX_FUNDING_AGE_MS: ${SOURCE_MAX_FUNDING_AGE_MS:-7200000}
  SOURCE_MAX_BORROW_AGE_MS: ${SOURCE_MAX_BORROW_AGE_MS:-7200000}
  PAPER_NOTIONAL_USD_MICROS: ${PAPER_NOTIONAL_USD_MICROS:-500000000}
  PAPER_MAX_JITOSOL_ATOMS: ${PAPER_MAX_JITOSOL_ATOMS:-10000000000}
  PAPER_COLLATERAL_USD_MICROS: ${PAPER_COLLATERAL_USD_MICROS:-500000000}
  PAPER_COSTS_USD_MICROS: ${PAPER_COSTS_USD_MICROS:-200000}
  PAPER_RISK_HAIRCUT_USD_MICROS: ${PAPER_RISK_HAIRCUT_USD_MICROS:-50000}
  PAPER_SLIPPAGE_BPS: ${PAPER_SLIPPAGE_BPS:-50}
  EXPECTED_HOLD_HOURS: ${EXPECTED_HOLD_HOURS:-72}
  MAXIMUM_BREAK_EVEN_HOURS: ${MAXIMUM_BREAK_EVEN_HOURS:-48}
  REVERSE_MIN_NEGATIVE_FUNDING_PPM: ${REVERSE_MIN_NEGATIVE_FUNDING_PPM:-10}
  REVERSE_MAX_BORROW_UTILIZATION_PPM: ${REVERSE_MAX_BORROW_UTILIZATION_PPM:-950000}
  JITOSOL_REWARD_HAIRCUT_PPM: ${JITOSOL_REWARD_HAIRCUT_PPM:-250000}
  MAX_SOURCE_AGE_MS: ${MAX_SOURCE_AGE_MS:-60000}
  MIN_MARGIN_RATIO_PPM: ${MIN_MARGIN_RATIO_PPM:-1500000}
  MIN_LIQUIDATION_DISTANCE_BPS: ${MIN_LIQUIDATION_DISTANCE_BPS:-1000}
  REBALANCE_DELTA_BPS: ${REBALANCE_DELTA_BPS:-50}
  EXECUTION_POLICY_PROFILE: ${EXECUTION_POLICY_PROFILE:-shadow-v1}
  EXECUTION_INTENT_TTL_MS: ${EXECUTION_INTENT_TTL_MS:-5000}
  MAX_EXECUTION_SLIPPAGE_BPS: ${MAX_EXECUTION_SLIPPAGE_BPS:-50}
  DIRECT_UNSTAKE_SCENARIO: ${DIRECT_UNSTAKE_SCENARIO:-withdraw}
  DIRECT_UNSTAKE_FEE_PPM: ${DIRECT_UNSTAKE_FEE_PPM:-1000}
  DIRECT_UNSTAKE_CHAIN_FEES_USD_MICROS: ${DIRECT_UNSTAKE_CHAIN_FEES_USD_MICROS:-20000}
  DIRECT_UNSTAKE_HEDGE_COST_USD_MICROS: ${DIRECT_UNSTAKE_HEDGE_COST_USD_MICROS:-0}
  DIRECT_UNSTAKE_CAPITAL_DELAY_HAIRCUT_USD_MICROS: ${DIRECT_UNSTAKE_CAPITAL_DELAY_HAIRCUT_USD_MICROS:-1000000}
  DIRECT_UNSTAKE_FINAL_HEDGE_CLOSE_COST_USD_MICROS: ${DIRECT_UNSTAKE_FINAL_HEDGE_CLOSE_COST_USD_MICROS:-250000}

x-local-logging: &local-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: funding
      POSTGRES_USER: funding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paper}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funding -d funding"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres_data_v48:/var/lib/postgresql/data
    networks:
      - database
    mem_limit: 1g
    pids_limit: 256
    logging: *local-logging
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: funding
      PGDATABASE: funding
      PGPASSWORD: ${POSTGRES_PASSWORD:-paper}
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"
    volumes:
      - ./db/migrate.sh:/migrate.sh:ro
      - ./db/migrations:/migrations:ro
    networks:
      - database
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging: *local-logging

  collector:
    image: delta-neutral-funding-collector:latest
    build:
      context: .
      dockerfile: infra/docker/collector.Dockerfile
      additional_contexts:
        mesh_lang: ../mesh-lang
      args:
        CODE_COMMIT: ${CODE_COMMIT:-development}
        MESH_COMMIT: c5379f8d00990df18248e4bf2d53bbb1d04868fb
      provenance: mode=max
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *paper-environment
      DATABASE_URL: postgresql://funding:${POSTGRES_PASSWORD:-paper}@postgres:5432/funding
      OPERATOR_HMAC_SECRET: ${OPERATOR_HMAC_SECRET:-local-operator-only-change-me}
      DEPLOYMENT_ENVIRONMENT: local
      INSTANCE_ID: ${INSTANCE_ID:-collector-local-1}
      LEADER_LEASE_MS: ${LEADER_LEASE_MS:-60000}
      LEADER_RENEW_MS: ${LEADER_RENEW_MS:-3000}
      PORT: 8080
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - database
      - ingest
      - observability
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 512m
    pids_limit: 128
    logging: *local-logging
    restart: unless-stopped

  adapter:
    image: delta-neutral-funding-adapter:latest
    build:
      context: .
      dockerfile: infra/docker/adapter.Dockerfile
      args:
        CODE_COMMIT: ${CODE_COMMIT:-development}
      provenance: mode=max
    depends_on:
      collector:
        condition: service_healthy
    environment:
      <<: *paper-environment
      COLLECTOR_URL: http://collector:8080/v1/events
      REQUEST_TIMEOUT_MS: 3000
      COLLECTOR_REQUEST_TIMEOUT_MS: 120000
      HEALTH_PORT: 8090
      PHOENIX_URLS: ${PHOENIX_URLS:-https://perp-api.phoenix.trade}
      PHOENIX_BEARER_TOKEN: ${PHOENIX_BEARER_TOKEN:-}
      HYPERLIQUID_URLS: ${HYPERLIQUID_URLS:-https://api.hyperliquid.xyz}
      KAMINO_URLS: ${KAMINO_URLS:-https://api.kamino.finance}
      KAMINO_LENDING_MARKET: ${KAMINO_LENDING_MARKET:-7u3HeHxYDLhnCoErrtycNokbQYbWGzLs6JSDqGAv5PfF}
      KAMINO_BORROW_RESERVES: ${KAMINO_BORROW_RESERVES:-SOL:d4A2prbA2whesmvHaL88BH6Ewn5N4bTSU2Ze8P6Bc4Q:So11111111111111111111111111111111111111112,JTO:9Ukd2MSw5RvVFaN8jLhWxjHLEGiF1F6Hf7v3Zq5hZsKB:jtojtomepa8beP8AuQc6eXt5FriJwfFMwQx2v2f9mCL}
      SOLANA_RPC_URLS: ${SOLANA_RPC_URLS:-https://api.mainnet-beta.solana.com}
      JUPITER_URLS: ${JUPITER_URLS:-https://api.jup.ag/swap/v1}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - ingest
    mem_limit: 256m
    pids_limit: 128
    logging: *local-logging
    restart: unless-stopped

  solana-wallet-flow:
    profiles: ["solana-wallet-flow"]
    image: delta-neutral-funding-adapter:latest
    depends_on:
      collector:
        condition: service_healthy
    command: ["dist/solana-wallet-flow-cli.js"]
    environment:
      ADAPTER_HMAC_SECRET: ${ADAPTER_HMAC_SECRET:-local-paper-only-change-me}
      ADAPTER_SESSION_ID: ${ADAPTER_SESSION_ID:-solana-wallet-flow-local}
      COLLECTOR_URL: http://collector:8080/v1/events
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      JUPITER_URL: ${JUPITER_URL:-https://api.jup.ag/swap/v1}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      SOLANA_SANCTIONED_ADDRESSES: ${SOLANA_SANCTIONED_ADDRESSES:-}
      SOLANA_WALLET_POLL_INTERVAL_MS: ${SOLANA_WALLET_POLL_INTERVAL_MS:-5000}
      SOLANA_WALLET_MAX_BACKFILL_PAGES: ${SOLANA_WALLET_MAX_BACKFILL_PAGES:-10}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
    healthcheck:
      disable: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - ingest
    mem_limit: 256m
    pids_limit: 128
    logging: *local-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      collector:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=35d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - observability
      - monitoring_ui
    mem_limit: 512m
    pids_limit: 128
    logging: *local-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-paper}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_ui
    mem_limit: 512m
    pids_limit: 256
    logging: *local-logging
    restart: unless-stopped

volumes:
  # Preserve older paper evidence when a release changes its runtime fingerprint.
  postgres_data_v48:
  prometheus_data:
  grafana_data:

networks:
  database:
    internal: true
  ingest:
  observability:
    internal: true
  monitoring_ui:
